colecta:
  id_muestra: "COL-VAL-004"
  familia: "Passifloraceae"
  genero: "Passiflora"
  especie: "Passiflora incarnata"
  localidad: "Palmira, Valle del Cauca, Colombia"
  fecha: "2026-11-06"
  foto_campo: "images/passiflora_incarnata.jpg"

arquitectura_floral:
  simetria: "actinomorfa"
  tipo_inflorescencia: "solitaria"
  disposicion: "horizontal"

perianto:
  verticilos: "diclamidea"
  caliz:
    sepalos_numero: 5
    fusion: "dialisepalo"
    longitud_tubo_mm: 8.0              # Hipanto acopado corto
    color_hex: "#7A9F2E"               # Verde pálido en el envés (abaxial)
  corola:
    petalos_numero: 5
    fusion: "dialipetala"
    longitud_tubo_mm: 38.0             # Longitud de la corona de filamentos
    longitud_limbo_mm: 42.0            # Pétalos y sépalos oblongo-redondeados
    ancho_petalo_mm: 16.0
    diferenciacion_dorsoventral:
      factor_tamano_dorsal: 1.05       # Sépalos ligeramente más anchos con arista subapical
      factor_tamano_ventral: 0.95      # Pétalos más suaves
      curvatura_dorsal_grados: 25.0    # Tépalos reflexos (curvados hacia atrás)
    grosor_pared_mm: 1.2
    color_garganta_hex: "#FFFFFF"      # Base blanca de la corona bandeada
    color_limbo_hex: "#D0B3E1"         # Lavanda pálido de los pétalos

androceo:
  estambres_numero: 5
  fusion_filamentos: "androginoforo"
  filamento_longitud_mm: 22.0          # Androginóforo esbelto y largo
  filamento_grosor_mm: 2.2
  antera_longitud_mm: 7.5
  color_filamento_hex: "#E8E8E8"       # Columna blanca moteada de púrpura
  color_antera_hex: "#D4AC0D"          # Anteras versátiles amarillas

gineceo:
  posicion_ovario: "supero"            # Ovario elevado sobre la columna
  estilo_longitud_mm: 9.0
  estilo_grosor_mm: 1.5
  estigma_lobulos: 3
  color_ovario_hex: "#A9DFBF"          # Ovario verde claro subgloboso
  color_estilo_hex: "#E8E8E8"          # Estilos moteados de púrpura