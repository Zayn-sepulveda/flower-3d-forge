colecta:
  id_muestra: "COL-VAL-005"
  familia: "Asteraceae"
  genero: "Helianthus"
  especie: "Helianthus annuus"
  localidad: "Palmira, Valle del Cauca (CIAT), Colombia"
  fecha: "2026-11-06"
  foto_campo: "images/helianthus_annuus.jpg"

arquitectura_floral:
  simetria: "actinomorfa"
  tipo_inflorescencia: "capitulo"
  disposicion: "inclinada"             # Inclinación heliotrópica orgánica (35°)

perianto:
  verticilos: "diclamidea"
  caliz:
    sepalos_numero: 48                 # 3 series imbricadas de filarias foliáceas acuminadas
    fusion: "dialisepalo"
    longitud_tubo_mm: 28.0             # Largo de las brácteas involucrales envolventes
    color_hex: "#3E6B24"               # Verde oliva intenso del involucro pubescente
  corola:
    petalos_numero: 42                 # Flores liguladas en 3 capas radiales escalonadas
    fusion: "gamopetala"
    longitud_tubo_mm: 5.5              # Tubo basal estrecho de la lígula
    longitud_limbo_mm: 72.0            # Lígula radiante ondulada
    ancho_petalo_mm: 21.0
    diferenciacion_dorsoventral:
      factor_tamano_dorsal: 1.15       # Variación alométrica entre capas externa e interna
      factor_tamano_ventral: 0.88
      curvatura_dorsal_grados: 25.0    # Ondulación sinusoidal y torsión longitudinal
    grosor_pared_mm: 1.1
    color_garganta_hex: "#E67E22"      # Base anaranjada viva de la lígula
    color_limbo_hex: "#FFC300"         # Amarillo oro brillante

androceo:
  estambres_numero: 5                  # Flósculos del disco con anteras singenésicas
  fusion_filamentos: "singenesico"
  filamento_longitud_mm: 4.2
  filamento_grosor_mm: 0.6
  antera_longitud_mm: 4.8
  color_filamento_hex: "#4E3629"
  color_antera_hex: "#24140E"          # Pardo-purpúreo muy oscuro del cilindro de anteras

gineceo:
  posicion_ovario: "infero"
  estilo_longitud_mm: 9.8              # Estilo exerto con estigma bífido recurvado
  estilo_grosor_mm: 0.85
  estigma_lobulos: 2
  color_ovario_hex: "#3D2012"
  color_estilo_hex: "#F4D03F"          # Amarillo oro del estigma bífido en antesis