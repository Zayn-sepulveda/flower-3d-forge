<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Herbario 3D - Crotalaria sp.</title>
    <style>
        body { margin: 0; overflow: hidden; background: #121418; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; }
        
        /* Ficha taxonómica flotante (Esquina superior izquierda) */
        .info-card {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(22, 27, 34, 0.85);
            backdrop-filter: blur(8px);
            color: #f0f6fc;
            padding: 16px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 320px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            pointer-events: none;
        }
        .info-card h2 { margin: 0 0 6px 0; font-size: 1.25rem; font-style: italic; color: #58a6ff; }
        .info-card p { margin: 4px 0; font-size: 0.85rem; color: #8b949e; }
        .info-card strong { color: #c9d1d9; }

        /* Fotografía real de campo (Esquina inferior derecha) */
        .specimen-photo-box {
            position: absolute;
            bottom: 24px;
            right: 24px;
            width: 220px;
            background: rgba(22, 27, 34, 0.9);
            border: 2px solid #58a6ff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            transition: transform 0.3s ease, width 0.3s ease;
            z-index: 10;
        }
        .specimen-photo-box:hover {
            width: 340px;
            transform: scale(1.02);
        }
        .specimen-photo-box img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            max-height: 240px;
        }
        .photo-placeholder {
            padding: 40px 16px;
            text-align: center;
            font-size: 0.8rem;
            color: #8b949e;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .photo-label {
            padding: 8px 12px;
            font-size: 0.75rem;
            font-weight: 600;
            text-align: center;
            color: #f0f6fc;
            background: #161b22;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
</head>
<body>
    <div class="info-card">
        <h2>Crotalaria sp.</h2>
        <p><strong>Familia:</strong> Fabaceae</p>
        <p><strong>Muestra:</strong> COL-001</p>
        <p><strong>Localidad:</strong> Palmira, Valle del Cauca</p>
        <p><strong>Fecha:</strong> 2026-11-03</p>
        <p style="margin-top: 10px; font-size: 0.75rem; color: #58a6ff;">● Rotar: Clic izquierdo | Zoom: Rueda</p>
    </div>

    <div class="specimen-photo-box">
        <img src='../images/crotalaria_sp.jpg' alt='Espécimen real' onerror="this.parentElement.innerHTML='<div class=\'photo-placeholder\'>📷 Foto de campo no encontrada<br><small style=\'color:#58a6ff\'>../images/crotalaria_sp.jpg</small></div><div class=\'photo-label\'>Registro de Campo</div>'" />
        <div class="photo-label">Registro de Campo</div>
    </div>

    <div id="canvas-container"></div>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, -60, 45);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
        scene.add(ambientLight);

        const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight1.position.set(30, 40, 50);
        scene.add(dirLight1);

        const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.3);
        dirLight2.position.set(-30, -40, -20);
        scene.add(dirLight2);

        const loader = new THREE.OBJLoader();
        loader.load('crotalaria_sp.obj', function (object) {
            object.traverse(function (child) {
                if (child.isMesh) {
                    child.material = new THREE.MeshStandardMaterial({
                        vertexColors: true,
                        roughness: 0.35,
                        metalness: 0.05,
                        side: THREE.DoubleSide
                    });
                }
            });
            scene.add(object);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
